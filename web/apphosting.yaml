# Firebase App Hosting config. App Hosting is the GA path for SSR Next.js on
# Firebase — it builds from your Git repo and runs the server on Cloud Run,
# which is what public status pages need (SEO, custom domains, cheap ISR).
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_ME
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_ME
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_ME
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_ME
    availability:
      - BUILD
      - RUNTIME
